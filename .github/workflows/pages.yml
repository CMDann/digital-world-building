name: Deploy scene editor to GitHub Pages
on:
  push:
    branches: [master, main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate scene format
        working-directory: demo
        run: npm test
      - name: Package editor and scene catalog
        working-directory: demo
        run: node scripts/package-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
