<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSD XR · Example</title><link rel="icon" href="data:,"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:14px monospace}canvas{display:block;width:100%;height:100%}#error{position:absolute;inset:20px;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere;color:#ffb5a9}</style><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script></head><body><canvas id="demo"></canvas><div id="error" hidden></div><script type="module">
const demos={demo1:'initDemo1',demo2:'initDemo2',demo3:'initDemo3',demo4:'initDemo4',demo5:'initDemo5',vr:'initVRScene',ar:'initARScene',assets:'initAssetsScene','ai-scene':'initAIScene'};
const params=new URLSearchParams(location.search),key=params.get('demo')||'demo1',editable=params.get('editor')==='1',run=params.get('run');let started=false,failed=false;
function notify(type,extra={}){if(editable)parent.postMessage({type,run,...extra},location.origin);}
function report(error){failed=true;const message=error?.stack||error?.message||String(error);document.getElementById('error').hidden=false;document.getElementById('error').textContent=message;notify('example:error',{message});}
function theme(light){document.documentElement.dataset.theme=light?'light':'dark';document.dispatchEvent(new CustomEvent('themechange',{detail:{light}}));}
window.addEventListener('error',event=>{if(editable){report(event.error||event.message);event.preventDefault();}});window.addEventListener('unhandledrejection',event=>{if(editable){report(event.reason);event.preventDefault();}});
async function start(code){if(started)return;started=true;let url;try{if(!demos[key])throw new Error('Unknown example.');url=editable?URL.createObjectURL(new Blob([code+'\n//# sourceURL='+key+'-edited.js'],{type:'text/javascript'})):null;const module=await import(url||'./demos/'+key+'.js');if(typeof module[demos[key]]!=='function')throw new Error('Keep the exported '+demos[key]+'(canvas) function so Run can start this example.');await module[demos[key]](document.getElementById('demo'));theme(params.get('theme')==='light');document.documentElement.dataset.demoReady='true';if(!failed)notify('example:success');}catch(error){report(error);}finally{if(url)URL.revokeObjectURL(url);}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent)return;if(event.data?.type==='workspace-theme')theme(event.data.light);if(editable&&event.data?.type==='example:run'&&event.data.run===run&&typeof event.data.code==='string')start(event.data.code);});
if(editable)notify('example:ready');else start();
</script></body></html>
